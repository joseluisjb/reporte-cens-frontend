openapi: 3.0.3

info:
  title: NexoVolt — API REST (Iteración 1)
  version: 0.2.0-borrador
  description: |
    Contrato entre el frontend (React) y el backend (Django REST Framework) de NexoVolt.
    Cubre la **Iteración 1**: HU-A (extracción, consolidación y trazabilidad) y HU-D (seguridad,
    usuarios y auditoría). RF1–RF9, RF35 y RF25–RF31.

    **Estado: BORRADOR para revisión** de José Luis (usuarios, parámetros, extracción, historial) y
    Dilan (autenticación, roles, auditoría, validaciones). La versión 0.2 está **alineada con lo ya
    implementado** en `reporte-cens-backend` (rama `dev`, 10/10/2026: conceptos, grupos de conceptos
    y salud); donde el backend difiere de lo que pide la documentación, el README del contrato lo
    lista como diferencia por resolver. Lo que el frontend ya construyó y probó
    contra mocks se marca como *implementado en el frontend*; lo demás es propuesta.

    ## Reglas generales

    **Sesión y CSRF.** Sesión por cookie de Django (`sessionid`, HttpOnly). Para métodos que
    modifican datos (POST, PATCH, PUT, DELETE) el cliente envía el token CSRF en el encabezado
    `X-CSRFToken`, leído de la cookie `csrftoken` (se obtiene con `GET /auth/csrf/`). No se usan
    tokens en `localStorage`.

    **Inactividad (RF26).** La sesión vence a los 10 minutos sin actividad (vencimiento deslizante:
    cada petición la renueva). El frontend llama a `GET /auth/me/` cada ~5 minutos mientras el
    usuario trabaja para renovarla. Al vencer, cualquier endpoint responde `401`.

    **Roles (RF27).** `ANALISTA_CARTERA` (Analista de Cartera) y `ADMINISTRADOR` (Administrador),
    los códigos que ya usa el backend en `request.user.rol`; el frontend los traduce a texto. Cada
    operación indica sus roles en `x-roles`. Un rol sin permiso recibe `403`; sin sesión, `401`.

    **Primer ingreso.** Un usuario con `must_change_password = true` solo puede usar
    `/auth/me/`, `/auth/logout/` y `/auth/change-password/`; el resto responde `403` con
    `code: "password_change_required"`.

    **Errores.** Formato de DRF, siempre en español (RF31):
    `{ "detail": "..." }` para errores generales o `{ "campo": ["mensaje", ...] }` para errores de
    validación (`400`). Los errores generales pueden traer un `code` estable para distinguirlos
    (por ejemplo, un `403` por CSRF de uno por permisos).

    **Formatos.** JSON UTF-8. Fechas y horas en ISO 8601 con zona (`America/Bogota`, UTC−05:00).
    Fechas de corte como `YYYY-MM-DD`. Montos en pesos colombianos como número (sin símbolo ni
    separadores). Las contraseñas nunca se devuelven, salvo la temporal al crear un usuario.

    **Paginación.** Los listados que pueden crecer (`/extracciones/`, `/auditoria/`, obligaciones,
    historial) usan `?page=` y `?page_size=` (por defecto 20, máximo 100) y responden
    `{ count, next, previous, results }`. Los listados pequeños (`/users/`, `/conceptos/`) devuelven
    un arreglo plano.

    **Datos reservados.** Los datos de CENS son confidenciales: el log de auditoría no guarda
    contraseñas ni datos personales completos.

    ## Fuera de alcance de este contrato (no construir sin confirmar)
    "Cambiar datos", "Cambiar de perfil" y exportar log/resumen aparecen en la maqueta pero no
    en los RF de la Iteración 1. `POST /demo/switch-profile/` existe solo en los mocks del
    frontend; el backend real **no** lo tendrá. Los **grupos de conceptos** (RF43) sí están en el
    contrato porque el backend ya los implementó; hay que confirmar que RF43 forme parte del
    alcance documentado (no figura en la Planificación ni en la Asignación).
  contact:
    name: Equipo NexoVolt — Seminario Integrador 3

servers:
  - url: /api
    description: Mismo dominio (en desarrollo, el proxy de Vite apunta a http://localhost:8000)

tags:
  - name: Autenticación
    description: RF25, RF26, RF29 · Dilan (login, sesión) y José Luis (recuperación)
  - name: Usuarios
    description: RF28 · José Luis · solo Administrador
  - name: Utilidades
    description: Salud del servidor
  - name: Conceptos de energía
    description: RF35 · José Luis (API) y Angel (tabla) · lectura Analista y Administrador, escritura Administrador
  - name: Grupos de conceptos
    description: RF43 · José Luis · lectura Analista y Administrador, escritura Administrador
  - name: Extracción
    description: RF1–RF5, RF7 · José Luis y Clara
  - name: Historial
    description: RF6, RF8 (RF9 es un comando mensual, sin endpoint) · José Luis y Clara
  - name: Auditoría
    description: RF30 · Dilan · solo Administrador

security:
  - sessionCookie: []

paths:
  # ───────────────────────── Autenticación ─────────────────────────
  /auth/csrf/:
    get:
      tags: [Autenticación]
      summary: Obtener la cookie CSRF
      description: Entrega la cookie `csrftoken` (`ensure_csrf_cookie`). *Implementado en el frontend.*
      operationId: authCsrf
      security: []
      x-roles: [público]
      responses:
        '204':
          description: Cookie `csrftoken` entregada.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`csrftoken=...; SameSite=Lax`"

  /auth/login/:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (RF25)
      description: |
        Valida correo y contraseña y abre la sesión. *Implementado en el frontend.*
        Un usuario desactivado recibe `403` solo si la contraseña es correcta (no se revela nada
        con una contraseña incorrecta). Cada intento exitoso queda en el log de auditoría.
      operationId: authLogin
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada. Entrega la cookie `sessionid`.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`sessionid=...; HttpOnly; Secure (en producción); SameSite=Lax`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Correo o contraseña incorrectos.' }
        '403':
          description: Usuario desactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Tu usuario está desactivado. Contacta al administrador.', code: user_inactive }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout/:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión (RF26)
      description: Invalida la sesión en el servidor. *Implementado en el frontend.*
      operationId: authLogout
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '204': { description: Sesión cerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      description: |
        Devuelve el usuario autenticado. **También sirve de "ping"**: el frontend lo llama cada
        ~5 minutos mientras el usuario trabaja para renovar la sesión. *Implementado en el frontend.*
      operationId: authMe
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password/:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña propia (RF28)
      description: |
        Usado en el cambio obligatorio del primer ingreso y en cualquier cambio voluntario.
        Pone `must_change_password = false`. Reglas de la nueva contraseña: mínimo 8 caracteres,
        al menos una mayúscula y al menos un número. *Implementado en el frontend.*
      operationId: authChangePassword
      x-roles: [Analista de Cartera, Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Contraseña cambiada. }
        '400':
          description: Validación por campo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example:
                current_password: ['La contraseña actual no es correcta.']
                new_password: ['La contraseña debe tener al menos una mayúscula.']
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/:
    post:
      tags: [Autenticación]
      summary: Solicitar enlace de recuperación (RF29)
      description: |
        Responde **siempre igual (`202`)**, exista o no el correo, para no revelar qué correos están
        registrados. Si existe, se envía al correo corporativo un enlace
        `{FRONTEND_URL}/restablecer?token=XXXX` de **un solo uso** y vencimiento corto (propuesta:
        30 minutos). Con límite de intentos por correo/IP. *Implementado en el frontend.*
      operationId: authPasswordReset
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Solicitud recibida (siempre la misma respuesta).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Si el correo está registrado, recibirás un enlace.' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm/:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña con el token (RF29)
      description: El token es de un solo uso. *Implementado en el frontend.*
      operationId: authPasswordResetConfirm
      security: []
      x-roles: [público]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: Contraseña restablecida. }
        '400':
          description: Token vencido, ya usado o contraseña inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { token: ['El enlace no es válido o ya venció.'] }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────── Usuarios ─────────────────────────
  /users/:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (RF28)
      description: "*Implementado en el frontend.*"
      operationId: usersList
      x-roles: [Administrador]
      responses:
        '200':
          description: Todos los usuarios, activos e inactivos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear usuario (RF28)
      description: |
        Crea el usuario con `must_change_password = true` y genera una **contraseña temporal que se
        envía por correo** al usuario (decisión del equipo). La respuesta **no** incluye la
        contraseña: `temporary_password` viene en `null` o ausente, y el frontend muestra "La
        contraseña temporal se envió a su correo". En desarrollo el correo sale por consola
        (`EmailBackend` de consola). El correo es único. Queda en el log de auditoría.
        *Implementado en el frontend.*
      operationId: usersCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreatedResponse' }
        '400':
          description: Validación por campo (correo repetido, rol inválido, campos vacíos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { email: ['Ya existe un usuario con ese correo.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/:
    patch:
      tags: [Usuarios]
      summary: Editar, activar o desactivar un usuario (RF28)
      description: |
        Sirve para editar datos y para activar/desactivar (`is_active`). No hay `DELETE`: los
        usuarios se desactivan, no se borran.

        Reglas del servidor: un administrador **no puede desactivarse a sí mismo** ni
        **cambiarse su propio rol**. Queda en el log de auditoría. *Implementado en el frontend.*
      operationId: usersUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Usuario actualizado (objeto `user` directo, sin envoltura).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Utilidades ─────────────────────────
  /salud/:
    get:
      tags: [Utilidades]
      summary: Verificar que el servidor responde
      description: Sin sesión. *Implementado en el backend.*
      operationId: salud
      security: []
      x-roles: [público]
      responses:
        '200':
          description: Servidor disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }

  # ───────────────────────── Conceptos de energía (RF35) ─────────────────────────
  /conceptos/:
    get:
      tags: [Conceptos de energía]
      summary: Listar códigos de concepto de energía (RF35)
      description: |
        Tabla de parámetros que define qué conceptos de facturación son energía (en Oracle,
        `NV_CONCEPTO_REPORTABLE`, columna `REPORTABLE`). La extracción lee **solo los códigos
        activos**. Sin paginación. La búsqueda por texto se hace en el cliente. *Implementado en el
        backend.*
      operationId: conceptosList
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - name: activo
          in: query
          description: Filtra por estado (`true` o `false`). Sin valor, devuelve todos.
          schema: { type: boolean }
      responses:
        '200':
          description: Códigos de concepto.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Concepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Conceptos de energía]
      summary: Agregar un código de concepto (RF35)
      description: |
        Se crea activo salvo que se indique lo contrario. El código es único: si ya existe responde
        `409`. *Implementado en el backend* (hoy permite también al Analista; el contrato propone solo
        Administrador, ver README). Debe quedar en el log de auditoría.
      operationId: conceptosCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptoCreateRequest' }
      responses:
        '201':
          description: Código creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Concepto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El código ya existe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El código de concepto ya existe.' }

  /conceptos/{codigo}/:
    patch:
      tags: [Conceptos de energía]
      summary: Editar, activar o desactivar un código (RF35)
      description: |
        Cambiar `activo` no borra el código: deja de usarse en las próximas extracciones y se conserva
        para el historial. No hay `DELETE` ni se puede cambiar el `codigo`. *Implementado en el
        backend.* Debe quedar en el log de auditoría.
      operationId: conceptosUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptoUpdateRequest' }
      responses:
        '200':
          description: Código actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Concepto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Grupos de conceptos (RF43) ─────────────────────────
  /grupos-conceptos/:
    get:
      tags: [Grupos de conceptos]
      summary: Listar grupos de conceptos (RF43)
      description: |
        Un grupo agrupa conceptos de energía para elegirlo al ejecutar una extracción (maqueta 5 y 6).
        Sin paginación. *Implementado en el backend.*
      operationId: gruposList
      x-roles: [Analista de Cartera, Administrador]
      responses:
        '200':
          description: Grupos con sus conceptos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrupoConcepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Grupos de conceptos]
      summary: Crear un grupo de conceptos (RF43)
      description: |
        El nombre es único. Todos los conceptos deben existir y estar activos. *Implementado en el
        backend* (hoy permite también al Analista; el contrato propone solo Administrador).
      operationId: gruposCreate
      x-roles: [Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoConceptoCreateRequest' }
      responses:
        '201':
          description: Grupo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '400':
          description: Validación por campo, o un concepto que no existe o no está activo.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorCampos'
                  - $ref: '#/components/schemas/ErrorDetail'
              example: { detail: 'El concepto 3587 no existe o no está activo.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un grupo con ese nombre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El nombre de grupo ya existe.' }

  /grupos-conceptos/{id}/:
    get:
      tags: [Grupos de conceptos]
      summary: Detalle de un grupo de conceptos (RF43)
      description: "*Implementado en el backend.*"
      operationId: gruposRead
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Grupo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Grupos de conceptos]
      summary: Editar, activar o desactivar un grupo (RF43)
      description: |
        `conceptos` **reemplaza la lista completa** del grupo. *Implementado en el backend.*
      operationId: gruposUpdate
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoConceptoUpdateRequest' }
      responses:
        '200':
          description: Grupo actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoConcepto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe otro grupo con ese nombre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El nombre de grupo ya existe.' }
    delete:
      tags: [Grupos de conceptos]
      summary: Eliminar un grupo de conceptos (RF43)
      description: |
        Responde `409` si el grupo está asociado a un corte en estado `BORRADOR`. *Implementado en el
        backend.* Debe quedar en el log de auditoría.
      operationId: gruposDelete
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Grupo eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El grupo está asociado a un corte en borrador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'El grupo está asociado a un corte en estado BORRADOR.' }

  # ───────────────────────── Extracción y consolidación (RF1–RF5, RF7) ─────────────────────────
  /extracciones/:
    get:
      tags: [Extracción]
      summary: Historial de extracciones ("Registro de extracciones (logs)")
      description: |
        Cada extracción ejecutada, de más reciente a más antigua. Alimenta la tabla de registro de
        la pantalla 5 y el dato "Último corte procesado" del panel. **Propuesta.**
      operationId: extraccionesList
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de extracciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/Extraccion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Extracción]
      summary: Iniciar una extracción y consolidación (RF1–RF5, RF7)
      description: |
        Lanza el proceso: extrae deudores con financiación vigente (RF1), aísla los conceptos del
        **grupo elegido** (RF2, RF35, RF43), consolida pagos y saldos (RF3, RF4), calcula días de mora y
        edad de mora (RF7) y unifica el número de obligación (RF5). Oracle se accede **solo en
        lectura**.

        Es **asíncrono**: responde `202` de inmediato con la extracción en `en_proceso` y el
        frontend consulta `GET /extracciones/{id}/` hasta que termine (la maqueta muestra 5 pasos
        con barra de progreso). Si ya hay una extracción en curso responde `409`. Queda en el log
        de auditoría (`tipo_accion = calculo`, "Extracción de cartera ejecutada").

        **Diferencia con el backend:** José Luis la modela como un *corte* (tabla `NV_CORTE`, con
        `GRUPO_ID` y `ESTADO`, por ejemplo `BORRADOR`). Falta acordar el nombre del recurso y los
        valores de `estado`; `en_proceso`, `completada` y `fallida` son propuesta.
      operationId: extraccionesCreate
      x-roles: [Analista de Cartera, Administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtraccionCreateRequest' }
      responses:
        '202':
          description: Extracción aceptada y en proceso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extraccion' }
        '400':
          description: Fecha de corte faltante, inválida o futura, o grupo inexistente o inactivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCampos' }
              example: { fecha_corte: ['Selecciona una fecha de corte.'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya hay una extracción en proceso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'Ya hay una extracción en proceso. Espera a que termine.', code: extraction_running }

  /extracciones/{id}/:
    get:
      tags: [Extracción]
      summary: Estado de una extracción
      description: |
        Se consulta (polling) mientras `estado = en_proceso`. Trae `paso_actual` (0–5) para la
        barra de progreso y, al terminar, el total de obligaciones y el saldo consolidado.
        **Propuesta.**
      operationId: extraccionesRead
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Extracción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extraccion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /extracciones/{id}/obligaciones/:
    get:
      tags: [Extracción]
      summary: Resultados consolidados de una extracción (RF3–RF5, RF7)
      description: |
        Una fila por **obligación**, es decir, por **proceso de financiación** (no por deudor): un
        deudor con dos financiaciones aparece con dos obligaciones (Acta 2 y Manual TransUnion v34).
        Cada fila trae su saldo neto consolidado, días de mora y edad de mora (Tabla 9). Solo
        disponible cuando la extracción está `completada`; si no, `409`. La consulta de resultados
        queda en el log de auditoría. **Propuesta.**
      operationId: extraccionesObligaciones
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de obligaciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/Obligacion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La extracción aún no termina o falló.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: 'La extracción aún no ha terminado.', code: extraction_not_ready }

  # ───────────────────────── Historial (RF6, RF8) ─────────────────────────
  /historial/reportes/:
    get:
      tags: [Historial]
      summary: Historial de reportes enviados a TransUnion (RF6)
      description: |
        Cada envío mensual con fecha, estado reportado y valores enviados; los intentos fallidos o
        rechazados quedan registrados con su motivo. En la Iteración 1 el envío aún no existe
        (HU-C, Iteración 2), así que el listado puede estar vacío. **Borrador**: sin pantalla en la
        maqueta; la forma de los datos la define Clara con el esquema de historial.
      operationId: historialReportes
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: numero_obligacion
          in: query
          description: Filtra por número de obligación.
          schema: { $ref: '#/components/schemas/NumeroObligacion' }
        - name: periodo
          in: query
          description: Mes de corte, formato `YYYY-MM`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-09' }
      responses:
        '200':
          description: Página de reportes enviados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/ReporteHistorico' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /historial/deudores/:
    get:
      tags: [Historial]
      summary: Historial de estados de los deudores (RF8)
      description: |
        Conserva el estado de cada deudor en cada corte, sin perder los registros previos. El
        comando mensual de actualización (RF9) agrega un registro por corte; no tiene endpoint.
        **Borrador**: sin pantalla en la maqueta.
      operationId: historialDeudores
      x-roles: [Analista de Cartera, Administrador]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: numero_obligacion
          in: query
          schema: { $ref: '#/components/schemas/NumeroObligacion' }
        - name: periodo
          in: query
          description: Mes de corte, formato `YYYY-MM`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-09' }
      responses:
        '200':
          description: Página de registros históricos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/DeudorHistorico' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── Auditoría (RF30) ─────────────────────────
  /auditoria/:
    get:
      tags: [Auditoría]
      summary: Consultar el log de auditoría (RF30)
      description: |
        Quién, cuándo y qué acción se realizó. Se registra automáticamente (middleware o decorador)
        la actividad sobre la cartera y sobre la administración. Más reciente primero. El detalle
        **no** contiene contraseñas ni datos personales completos. Los registros no se editan ni se
        borran desde la API. **Propuesta** para la pantalla de Omar (maqueta 8).
      operationId: auditoriaList
      x-roles: [Administrador]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: desde
          in: query
          description: Fecha inicial, inclusive (`YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: hasta
          in: query
          description: Fecha final, inclusive (`YYYY-MM-DD`).
          schema: { type: string, format: date }
        - name: usuario
          in: query
          description: Id del usuario que realizó la acción.
          schema: { type: integer }
        - name: tipo_accion
          in: query
          description: Tipo de acción.
          schema: { $ref: '#/components/schemas/TipoAccion' }
        - name: modulo
          in: query
          schema: { $ref: '#/components/schemas/Modulo' }
      responses:
        '200':
          description: Página de registros de auditoría.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginado'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/RegistroAuditoria' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: Cookie de sesión de Django (HttpOnly). Los métodos que modifican datos exigen además el encabezado `X-CSRFToken`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Valor de la cookie `csrftoken`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Codigo:
      name: codigo
      in: path
      required: true
      description: Código del concepto en el sistema comercial de CENS (entero de 1 a 9999).
      schema: { type: integer, minimum: 1, maximum: 9999 }
    Page:
      name: page
      in: query
      description: Número de página, desde 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Registros por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Error de validación (RF31). Mensajes en español, por campo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorCampos' }
          example: { nombre: ['Ingresa el nombre completo.'] }
    Unauthorized:
      description: Sin sesión o sesión vencida por inactividad.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'Tu sesión venció. Inicia sesión de nuevo.', code: not_authenticated }
    Forbidden:
      description: |
        Sin permiso. Distinguir por `code`: `permission_denied` (rol insuficiente),
        `password_change_required` (primer ingreso pendiente), `csrf_failed` (token CSRF inválido).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'No tienes permiso para realizar esta acción.', code: permission_denied }
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'No se encontró el recurso solicitado.', code: not_found }
    TooManyRequests:
      description: Demasiados intentos. Reintentar más tarde.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segundos de espera.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDetail' }
          example: { detail: 'Demasiados intentos. Intenta de nuevo en unos minutos.', code: throttled }

  schemas:
    # ── Errores ──
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Mensaje en español para mostrar al usuario. }
        code: { type: string, description: Identificador estable del error (opcional). }
    ErrorCampos:
      type: object
      description: Un arreglo de mensajes por cada campo con error.
      additionalProperties:
        type: array
        items: { type: string }

    # ── Paginación ──
    Paginado:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, description: Total de registros que cumplen el filtro. }
        next: { type: string, format: uri, nullable: true }
        previous: { type: string, format: uri, nullable: true }
        results: { type: array, items: {} }

    # ── Usuarios y autenticación ──
    Rol:
      type: string
      enum: [ANALISTA_CARTERA, ADMINISTRADOR]
      description: Códigos que usa el backend (`request.user.rol`). El frontend los muestra como "Analista de Cartera" y "Administrador". Pendiente de confirmar por Dilan al construir la autenticación.
    User:
      type: object
      required: [id, nombre, email, rol, is_active, last_login, must_change_password]
      properties:
        id: { type: integer, example: 2 }
        nombre: { type: string, example: Rosa Martínez }
        email: { type: string, format: email, example: rmartinez@cens.com.co }
        rol: { $ref: '#/components/schemas/Rol' }
        is_active: { type: boolean }
        last_login: { type: string, format: date-time, nullable: true, description: Último acceso; `null` si nunca ingresó. }
        must_change_password: { type: boolean, description: "`true` mientras el usuario no cambie su contraseña temporal." }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password:
          type: string
          format: password
          description: Mínimo 8 caracteres, al menos una mayúscula y al menos un número.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          format: password
          description: Mismas reglas que `change-password`.
    UserCreateRequest:
      type: object
      required: [nombre, email, rol]
      properties:
        nombre: { type: string, minLength: 1 }
        email: { type: string, format: email, description: Correo corporativo; único. }
        rol: { $ref: '#/components/schemas/Rol' }
    UserUpdateRequest:
      type: object
      description: Todos los campos son opcionales; se envía solo lo que cambia.
      properties:
        nombre: { type: string, minLength: 1 }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        is_active: { type: boolean }
    UserCreatedResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        temporary_password:
          type: string
          nullable: true
          description: La contraseña temporal se envía por correo, así que el backend **no la devuelve**; llega `null` o ausente. El campo se conserva porque el frontend ya sabe mostrarla una sola vez si algún día se devolviera.

    # ── Conceptos de energía ──
    Concepto:
      type: object
      required: [codigo, descripcion, activo]
      properties:
        codigo: { type: integer, minimum: 1, maximum: 9999, example: 30, description: Código del concepto de facturación en el sistema comercial de CENS (catálogo del 02/10/2026). }
        descripcion: { type: string, maxLength: 60, example: CUOTA FINANCIACION ENERGIA }
        activo: { type: boolean, description: "`true` = Activo (reportable); `false` = Inactivo." }
        observacion: { type: string, maxLength: 200, nullable: true }
        fecha_creacion:
          type: string
          format: date-time
          description: "*(pendiente)* RF35 pide mostrar la fecha de creación, pero la tabla `NV_CONCEPTO_REPORTABLE` no tiene esa columna. Falta agregarla o sacarla de la auditoría."
    ConceptoCreateRequest:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo: { type: integer, minimum: 1, maximum: 9999 }
        descripcion: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean, default: true }
        observacion: { type: string, maxLength: 200, nullable: true }
    ConceptoUpdateRequest:
      type: object
      description: Todos los campos son opcionales. El código no se puede cambiar.
      properties:
        descripcion: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean }
        observacion: { type: string, maxLength: 200, nullable: true }

    # ── Grupos de conceptos (RF43) ──
    ConceptoResumen:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo: { type: integer, example: 30 }
        descripcion: { type: string, example: CUOTA FINANCIACION ENERGIA }
    GrupoConcepto:
      type: object
      required: [id, nombre, activo, conceptos, creado]
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, maxLength: 60, example: Energía financiada }
        activo: { type: boolean }
        conceptos:
          type: array
          items: { $ref: '#/components/schemas/ConceptoResumen' }
        creado: { type: string, format: date, example: '2026-10-10' }
    GrupoConceptoCreateRequest:
      type: object
      required: [nombre, conceptos]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 60 }
        conceptos:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 9999 }
          description: Códigos de concepto; todos deben existir y estar activos.
          example: [30, 94]
    GrupoConceptoUpdateRequest:
      type: object
      description: Todos los campos son opcionales; `conceptos` reemplaza la lista completa.
      properties:
        nombre: { type: string, minLength: 1, maxLength: 60 }
        activo: { type: boolean }
        conceptos:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 9999 }

    # ── Extracción ──
    ExtraccionCreateRequest:
      type: object
      required: [fecha_corte, grupo_id]
      properties:
        fecha_corte: { type: string, format: date, example: '2026-09-30' }
        grupo_id: { type: integer, example: 1, description: "Grupo de conceptos que define qué se considera energía en esta extracción (RF43). Debe existir y estar activo." }
    EstadoExtraccion:
      type: string
      enum: [en_proceso, completada, fallida]
    Extraccion:
      type: object
      required: [id, fecha_hora, usuario, fecha_corte, estado, paso_actual, total_pasos]
      properties:
        id: { type: integer }
        fecha_hora: { type: string, format: date-time, description: Cuándo se inició. }
        usuario: { type: string, example: Juan Pérez, description: Nombre de quien la ejecutó. }
        fecha_corte: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoExtraccion' }
        paso_actual:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            Pasos completados. 1 Extracción de deudores vigentes · 2 Aislamiento de conceptos de
            energía · 3 Consolidación de pagos y saldos · 4 Cálculo de días de mora (Tabla 9) ·
            5 Unificación de número de obligación. Los textos los pone el frontend.
        total_pasos: { type: integer, example: 5 }
        grupo:
          type: object
          description: Grupo de conceptos con el que se ejecutó.
          properties:
            id: { type: integer }
            nombre: { type: string }
        conceptos_utilizados:
          type: array
          items: { type: integer }
          description: Códigos de concepto del grupo al ejecutar (queda registrado para trazabilidad).
          example: [30, 94]
        total_obligaciones: { type: integer, nullable: true, description: "`null` mientras `en_proceso`." }
        saldo_total: { type: number, nullable: true, description: Suma del saldo consolidado en COP. }
        mensaje_error: { type: string, nullable: true, description: "Motivo, solo si `estado = fallida`." }
    EdadMora:
      type: object
      required: [codigo, descripcion]
      description: |
        Edad de mora según la Tabla 9 del Manual Sector Real v34 de TransUnion (verificada). Códigos
        `00` Normal (0–29 días), `01` Mora 30 (30–59), `02` Mora 60 (60–89), `03` Mora 90 (90–119),
        `04` Mora 120, `05` Mora 150, `06` Mora 180, `07` Mora 210, `08` Mora 240, `09` Mora 270,
        `10` Mora 300, `11` Mora 330, `12` Mora 360 (360–539), `13` Mora 540 (540–729) y
        `14` Mora 730 (730 días o más).
      properties:
        codigo:
          type: string
          enum: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14']
          example: '01'
        descripcion: { type: string, example: Mora 30 }
    NumeroObligacion:
      type: string
      maxLength: 20
      pattern: '^[A-Za-z0-9()*,\-./\\_]{1,20}$'
      example: 2257-4156
      description: |
        Número que identifica la obligación ante TransUnion: **único, permanente** y de **máximo 20
        caracteres** (Manual v34). Solo admite letras, números y los especiales `( ) * , - . / \ _`.
        Se deriva del número de proceso de la financiación y **no puede cambiar de un mes a otro**:
        si cambiara hay que renumerar (registro tipo 3) o TransUnion lo toma como obligación nueva.
    Obligacion:
      type: object
      required: [numero_obligacion, nombre_deudor, conceptos, saldo_consolidado, dias_mora, edad_mora]
      description: |
        Una **obligación = una financiación (proceso)**. Un mismo deudor puede tener varias, y una
        misma obligación puede tener varios titulares (principal, codeudor); en la Iteración 1 se
        muestra el titular principal. Los campos marcados *(pendiente)* salen de los 22 campos que
        pidió CENS (`campos tranusnion.xlsx`) y se confirman con Clara y con CENS antes de
        implementarse. El correo y el celular no se incluyen aquí: solo se necesitan para el archivo
        de TransUnion (Iteración 2) y son datos personales reservados.
      properties:
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        nombre_deudor: { type: string }
        tipo_identificacion:
          type: string
          pattern: '^\d{2}$'
          example: '01'
          description: "*(pendiente)* Tabla 2 de TransUnion: `01` Cédula, `02` NIT, `03` Cédula de extranjería, `04` Tarjeta de identidad, `05` Pasaporte, entre otros."
        numero_identificacion: { type: string, description: "*(pendiente)* Dato personal: mostrar enmascarado en pantalla y no registrarlo completo en el log." }
        conceptos:
          type: array
          items: { type: string }
          description: Códigos de concepto de energía que componen el saldo. En el sistema comercial son numéricos (por ejemplo `30`, `94`), no `ENE-001`.
          example: ['30']
        categoria_servicio:
          type: string
          example: '04'
          description: "*(pendiente)* Categoría de servicios (Tabla 5). Para CENS siempre `04` Servicio energía. Reemplaza a la \"línea de crédito\", que solo aplica al Sector Comercio."
        fecha_inicio: { type: string, format: date, description: "*(pendiente)* Fecha de inicio de la financiación." }
        fecha_limite_pago: { type: string, format: date, nullable: true, description: "*(pendiente)* Vencimiento de la última factura emitida; base del cálculo de mora (RF7). `null` si no tiene facturas vencidas." }
        valor_inicial: { type: number, description: "*(pendiente)* Valor inicial de la financiación en COP." }
        valor_cuota: { type: number, description: "*(pendiente)* Valor de la cuota en COP." }
        saldo_consolidado: { type: number, example: 1276016, description: "Saldo neto en pesos colombianos (RF4). El archivo de TransUnion lo exige en miles de pesos; esa conversión la hace el generador (Iteración 2), no la API." }
        valor_mora: { type: number, description: "*(pendiente)* Valor vencido en COP. Cero si no hay mora." }
        dias_mora: { type: integer, minimum: 0, example: 23, description: Fecha de corte menos fecha límite de pago (RF7). }
        cuotas_en_mora: { type: integer, minimum: 0, nullable: true, description: "*(pendiente)* RF19, Iteración 2. Obligatorio en el archivo cuando se reporta edad de mora." }
        edad_mora: { $ref: '#/components/schemas/EdadMora' }

    # ── Historial ──
    ReporteHistorico:
      type: object
      description: BORRADOR. Forma por confirmar con Clara (esquema de historial).
      properties:
        id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        periodo: { type: string, example: '2026-09' }
        fecha_envio: { type: string, format: date-time }
        estado_reportado: { type: string }
        valor_reportado: { type: number }
        resultado: { type: string, enum: [enviado, rechazado, fallido] }
        motivo: { type: string, nullable: true, description: Motivo si fue rechazado o falló. }
    DeudorHistorico:
      type: object
      description: BORRADOR. Forma por confirmar con Clara (esquema de historial).
      properties:
        id: { type: integer }
        numero_obligacion: { $ref: '#/components/schemas/NumeroObligacion' }
        periodo: { type: string, example: '2026-09' }
        fecha_corte: { type: string, format: date }
        saldo_consolidado: { type: number }
        dias_mora: { type: integer }
        edad_mora: { $ref: '#/components/schemas/EdadMora' }

    # ── Auditoría ──
    Modulo:
      type: string
      enum: [Seguridad, Usuarios, Parametrización, Extracción]
    TipoAccion:
      type: string
      description: |
        Clasificación estable de la acción. Une las dos listas de CENS: RF30 (consulta, generación de
        archivo, corrección, eliminación) y el Acta 3 (consulta, **cálculo, exportación y
        modificación**), más los eventos de seguridad y administración de la maqueta.
        `calculo` = ejecutar una extracción o consolidación; `exportacion` = exportar un archivo o
        reporte; `generacion` = generar el archivo plano de TransUnion; `modificacion` = cambiar
        datos de cartera; `correccion` = corregir información ya reportada.
      enum: [inicio_sesion, cierre_sesion, consulta, calculo, generacion, exportacion, modificacion, correccion, eliminacion, creacion, edicion, desactivacion]
    RegistroAuditoria:
      type: object
      required: [id, fecha_hora, usuario, rol, accion, tipo_accion, modulo, detalle]
      properties:
        id: { type: integer }
        fecha_hora: { type: string, format: date-time }
        usuario: { type: string, example: Rosa Martínez }
        rol: { $ref: '#/components/schemas/Rol' }
        accion: { type: string, example: Usuario creado, description: Texto legible en español. }
        tipo_accion: { $ref: '#/components/schemas/TipoAccion' }
        modulo: { $ref: '#/components/schemas/Modulo' }
        detalle:
          type: string
          example: María Gómez
          description: Sin contraseñas ni datos personales completos.
